name: CI & Docker Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish_docker:
        description: '是否构建并发布 Docker 镜像 (供习惯使用 Docker 的用户)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  IMAGE_NAME: ai-goofish

jobs:
  backend-tests:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_TESTS: '0'
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          mkdir -p reports
          python -m pytest --ignore=tests/audit -m 'not live and not live_slow' \
            --junitxml=reports/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Frontend build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Audit frontend dependencies (advisory)
        working-directory: web-ui
        run: |
          mkdir -p ../reports
          npm audit --package-lock-only --audit-level=high --fetch-timeout=30000 \
            --fetch-retries=3 --json > ../reports/npm-audit.json || true
      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm ci --no-audit --no-fund
      - name: Type check and build frontend
        working-directory: web-ui
        run: npm run build
      - name: Upload frontend build dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: reports/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  code-audit:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          output: reports/codeql
      - name: Check findings
        run: python scripts/ci/check_codeql.py reports/codeql --min-score 7.0 --soft-fail
      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: reports/codeql
          if-no-files-found: warn
          retention-days: 14

  secrets-audit:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.2'
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$tool_dir" reports
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --dir "$tool_dir"
          (
            cd "$tool_dir"
            sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          )
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        run: >-
          gitleaks git . --log-opts="--all" --redact=100 --no-banner
          --exit-code 0 --timeout 300 --report-format json
          --report-path reports/gitleaks.json || true
      - name: Upload secret audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-audit-report
          path: reports/gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install audit tooling
        run: python -m pip install -r requirements-audit.txt
      - name: Audit runtime dependencies
        run: |
          mkdir -p reports
          python -m pip_audit --requirement requirements-runtime.txt \
            --progress-spinner off --format json --output reports/pip-audit.json || true
      - name: Upload python dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: reports/pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  publish-docker:
    name: Build & publish Docker image (Optional / For Docker Users)
    needs: [backend-tests, frontend-build]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.publish_docker == true || inputs.publish_docker == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare tags
        id: prepare
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_OWNER,,}/${IMAGE_NAME}"
          tags="${image}:latest,${image}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            tags="${tags},${image}:${tag_name}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.prepare.outputs.tags }}
          cache-from: type=gha,scope=ai-goofish-docker
          cache-to: type=gha,scope=ai-goofish-docker,mode=min,ignore-error=true
