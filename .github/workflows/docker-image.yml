name: CI, code audit and Docker release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  IMAGE_NAME: ai-goofish
  BASE_IMAGE_NAME: ai-goofish-base

jobs:
  code-audit:
    name: Code audit (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python for audit gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze source and publish code scanning results
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:${{ matrix.language }}
          output: reports/codeql
      - name: Block high and critical findings
        run: python scripts/ci/check_codeql.py reports/codeql --min-score 7.0
      - name: Preserve audit reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}
          path: reports/codeql
          if-no-files-found: warn
          retention-days: 14

  secrets-audit:
    name: Git history secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.2'
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$tool_dir" reports
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --dir "$tool_dir"
          (
            cd "$tool_dir"
            sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          )
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all fetched history without exposing secret values
        run: >-
          gitleaks git . --log-opts="--all" --redact=100 --no-banner
          --exit-code 1 --timeout 300 --report-format json
          --report-path reports/gitleaks.json
      - name: Preserve redacted secret audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-audit
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-audit.txt
      - name: Install dependency audit tooling
        run: python -m pip install -r requirements-audit.txt
      - name: Audit runtime requirements and transitive dependencies
        run: |
          mkdir -p reports
          python -m pip_audit --requirement requirements-runtime.txt --strict \
            --progress-spinner off --format json --output reports/pip-audit.json
      - name: Preserve dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dependency-audit
          path: reports/pip-audit.json
          if-no-files-found: warn
          retention-days: 14

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_TESTS: '0'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: |
          mkdir -p reports
          python -m pytest --ignore=tests/audit -m 'not live and not live_slow' \
            --junitxml=reports/pytest.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-tests
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-checks:
    name: Frontend audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Audit locked dependencies including build tooling
        working-directory: web-ui
        run: |
          mkdir -p ../reports
          npm audit --package-lock-only --audit-level=high --fetch-timeout=30000 \
            --fetch-retries=1 --json > ../reports/npm-audit.json
      - name: Install locked frontend dependencies
        id: install
        if: ${{ !cancelled() }}
        working-directory: web-ui
        run: npm ci --no-audit --no-fund
      - name: Type check and build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: web-ui
        run: npm run build
      - name: Preserve frontend audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-audit
          path: reports/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs: [code-audit, secrets-audit, python-audit, backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every audit and test job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Audit and test results\n\n| Check | Result |\n| --- | --- |\n")
              for name, job in jobs.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          failed = [name for name, job in jobs.items() if job["result"] != "success"]
          if failed:
              print("Release blocked: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY

  build-base:
    name: Publish audited base image
    needs: quality-gate
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      base_image: ${{ steps.prepare.outputs.base_image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare base image tags
        id: prepare
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          base_image="ghcr.io/${REPO_OWNER,,}/${BASE_IMAGE_NAME}"
          {
            echo "base_image=${base_image}"
            echo 'base_tags<<EOF'
            printf '%s\n' "${base_image}:latest" "${base_image}:${GITHUB_SHA}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push base image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.prepare.outputs.base_tags }}
          cache-from: type=gha,scope=ai-goofish-base-docker
          cache-to: type=gha,scope=ai-goofish-base-docker,mode=min,ignore-error=true

  build-and-push:
    name: Publish audited application image
    needs: [quality-gate, build-base]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare application image tags
        id: prepare
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_OWNER,,}/${IMAGE_NAME}"
          {
            echo 'app_tags<<EOF'
            printf '%s\n' "${image}:latest" "${image}:${GITHUB_SHA}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push application using the audited base digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.base_image }}
          tags: ${{ steps.prepare.outputs.app_tags }}
          cache-from: type=gha,scope=ai-goofish-release-docker
          cache-to: type=gha,scope=ai-goofish-release-docker,mode=min,ignore-error=true
