name: CI, Desktop & Docker Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish_docker:
        description: '是否构建并发布 Docker 镜像 (供习惯使用 Docker 的用户)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  IMAGE_NAME: ai-goofish

jobs:
  backend-tests:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_TESTS: '0'
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          mkdir -p reports
          python -m pytest --ignore=tests/audit -m 'not live and not live_slow' \
            --junitxml=reports/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Frontend build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Audit frontend dependencies
        working-directory: web-ui
        run: |
          mkdir -p ../reports
          audit_status=0
          npm audit --package-lock-only --audit-level=high --fetch-timeout=30000 \
            --fetch-retries=3 --json > ../reports/npm-audit.json || audit_status=$?
          if (( audit_status > 1 )); then
            exit "$audit_status"
          fi
          python ../scripts/ci/check_npm_audit.py ../reports/npm-audit.json package-lock.json
      - name: Install frontend dependencies
        id: install
        if: ${{ !cancelled() }}
        working-directory: web-ui
        run: npm ci --no-audit --no-fund
      - name: Type check and build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: web-ui
        run: npm run build
      - name: Run frontend security and toast regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/frontend/ci-regressions.test.cjs
      - name: Record frontend source revision and file checksums
        run: python scripts/ci/desktop_package.py record-frontend
      - name: Upload frontend build dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: reports/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  windows-desktop:
    name: Windows desktop EXE
    needs: [backend-tests, frontend-build]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RUN_LIVE_TESTS: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Windows desktop and test dependencies
        run: python -m pip install -r requirements-desktop.txt pytest
      - name: Record Windows build dependencies
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m pip freeze | Set-Content -LiteralPath reports/windows-dependencies.txt -Encoding utf8
      - name: Download tested frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Verify frontend matches this source revision
        run: python scripts/ci/desktop_package.py verify-frontend
      - name: Run Windows regressions
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m pytest --ignore=tests/audit -m "not live and not live_slow" --junitxml=reports/windows-tests.xml
      - name: Build windowed executable with application icon
        run: python -m PyInstaller --noconfirm --distpath audit/desktop/dist --workpath audit/desktop/build desktop.spec
      - name: Smoke test worker, HTTP server and native desktop
        timeout-minutes: 8
        run: python scripts/ci/check_desktop_smoke.py audit/desktop/dist/GoofishMonitor.exe --native --report reports/desktop-gui.json --startup-timeout 120
      - name: Prepare portable download
        run: python scripts/ci/desktop_package.py prepare
      - name: Upload desktop package
        id: desktop-package
        uses: actions/upload-artifact@v4
        with:
          name: GoofishMonitor-Windows-x64
          path: audit/desktop/package/
          if-no-files-found: error
          retention-days: 30
      - name: Write desktop download summary
        env:
          DESKTOP_DOWNLOAD_URL: ${{ steps.desktop-package.outputs.artifact-url }}
        run: |
          @"
          ## Windows desktop package

          [Download GoofishMonitor-Windows-x64]($env:DESKTOP_DOWNLOAD_URL)

          Source revision: $env:GITHUB_SHA

          Includes GoofishMonitor.exe, README.txt, build-info.json and SHA256SUMS.txt.
          The frontend revision and checksums, Windows regressions, HTTP API and native desktop smoke checks passed.
          Extract the downloaded ZIP, exit the old app from the system tray, then start GoofishMonitor.exe.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Upload Windows test and GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-validation
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  code-audit:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: reports/codeql
      - name: Check findings
        run: python scripts/ci/check_codeql.py reports/codeql --min-score 7.0
      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: reports/codeql
          if-no-files-found: warn
          retention-days: 14

  secrets-audit:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.2'
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$tool_dir" reports
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --dir "$tool_dir"
          (
            cd "$tool_dir"
            sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          )
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        timeout-minutes: 5
        run: >-
          gitleaks git . --log-opts="--all" --redact=100 --no-banner
          --exit-code 1 --report-format json
          --report-path reports/gitleaks.json
      - name: Upload secret audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-audit-report
          path: reports/gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install audit tooling
        run: python -m pip install -r requirements-audit.txt
      - name: Audit runtime dependencies
        run: |
          mkdir -p reports
          python -m pip_audit --requirement requirements-runtime.txt --strict \
            --progress-spinner off --format json --output reports/pip-audit.json
      - name: Upload python dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: reports/pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs: [backend-tests, frontend-build, windows-desktop, code-audit, secrets-audit, python-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every audit and test to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Audit and test results\n\n| Check | Result |\n| --- | --- |\n")
              for name, job in jobs.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          failed = [name for name, job in jobs.items() if job["result"] != "success"]
          if failed:
              print("Release blocked: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY

  publish-docker:
    name: Build & publish Docker image (Optional / For Docker Users)
    needs: quality-gate
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.publish_docker == true || inputs.publish_docker == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare tags
        id: prepare
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_OWNER,,}/${IMAGE_NAME}"
          tags="${image}:latest,${image}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            tags="${tags},${image}:${tag_name}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.prepare.outputs.tags }}
          cache-from: type=gha,scope=ai-goofish-docker
          cache-to: type=gha,scope=ai-goofish-docker,mode=min,ignore-error=true
